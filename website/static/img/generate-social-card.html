<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1200px;
      height: 630px;
      background: linear-gradient(135deg, #1e1b4b 0%, #0f172a 50%, #164e63 100%);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: white;
      padding: 60px;
    }
    .logo {
      font-size: 48px;
      margin-bottom: 20px;
    }
    h1 {
      font-size: 72px;
      font-weight: 700;
      margin-bottom: 24px;
      text-align: center;
    }
    p {
      font-size: 32px;
      color: #94a3b8;
      text-align: center;
      max-width: 900px;
    }
    .features {
      display: flex;
      gap: 40px;
      margin-top: 48px;
    }
    .feature {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 24px;
      color: #e2e8f0;
    }
    .feature-icon {
      font-size: 32px;
    }
  </style>
</head>
<body>
  <div class="logo">📊</div>
  <h1>AgentOps</h1>
  <p>AI-Native Observability for Agent Applications</p>
  <div class="features">
    <div class="feature"><span class="feature-icon">🔍</span> Session Tracing</div>
    <div class="feature"><span class="feature-icon">💰</span> Cost Tracking</div>
    <div class="feature"><span class="feature-icon">🤖</span> AI Debugging</div>
  </div>
</body>
</html>
